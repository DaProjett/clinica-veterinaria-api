server:
  port: 8084
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev

  application:
    name: clinica-veterinaria-api

  datasource:
    url: jdbc:mysql://localhost:3306/clinica_veterinaria?useSSL=false&serverTimezone=UTC
    username: root
    password: root3011
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.MySQL8Dialect
